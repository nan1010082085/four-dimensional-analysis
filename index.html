<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四维分析 · 股票/期货盯盘台</title>
<script src="/static/echarts.min.js"></script>
<style>
  :root{
    --bg:#0e1117; --card:#161b22; --card2:#1c2230; --line:#283040;
    --text:#c9d1d9; --muted:#8b949e; --accent:#58a6ff;
    --up:#ef232a; --down:#14b143; --warn:#d29922;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;font-size:13px;}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);}
  header h1{font-size:15px;margin:0;color:var(--accent);white-space:nowrap;}
  header .sub{color:var(--muted);font-size:11px;}
  input#code{padding:6px 10px;background:var(--card2);border:1px solid var(--line);
    color:var(--text);border-radius:6px;width:120px;font-size:13px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{padding:5px 10px;background:var(--card2);border:1px solid var(--line);
    border-radius:14px;cursor:pointer;color:var(--muted);font-size:12px;}
  .chip:hover{color:var(--text);border-color:var(--accent);}
  .chip.active{background:var(--accent);color:#04101f;border-color:var(--accent);}
  .seg{display:flex;gap:4px;}
  .seg button{padding:5px 9px;background:var(--card2);border:1px solid var(--line);
    color:var(--muted);border-radius:6px;cursor:pointer;font-size:12px;}
  .seg button.active{color:var(--text);border-color:var(--accent);}
  .auto{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;}
  #status{margin-left:auto;color:var(--muted);font-size:12px;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:5px;}
  .dot.live{background:var(--down);box-shadow:0 0 6px var(--down);}
  main{display:grid;grid-template-columns:380px 1fr;gap:12px;padding:12px;align-items:start;}
  .left{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 90px);overflow:auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .card h2{margin:0 0 10px;font-size:13px;color:var(--accent);
    display:flex;align-items:center;gap:6px;border-left:3px solid var(--accent);padding-left:8px;}
  .card h2 small{color:var(--muted);font-weight:normal;font-size:11px;}
  .price-row{display:flex;align-items:baseline;gap:12px;}
  .price{font-size:34px;font-weight:700;line-height:1;}
  .chg{font-size:15px;font-weight:600;}
  .name{font-size:13px;color:var(--text);margin-bottom:6px;}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px;}
  .kv div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:3px;}
  .kv span:first-child{color:var(--muted);}
  .depth{margin-top:12px;font-size:12px;}
  .depth .row{display:flex;justify-content:space-between;padding:2px 6px;border-radius:4px;}
  .depth .ask{color:var(--down);} .depth .bid{color:var(--up);}
  .depth .hdr{color:var(--muted);font-size:11px;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:4px;}
  #chart{width:100%;height:760px;}
  .note{margin-top:10px;color:var(--warn);font-size:11px;line-height:1.5;
    background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.3);border-radius:6px;padding:8px;}
  .pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;margin-left:6px;}
  .pill.stock{background:rgba(88,166,255,.15);color:var(--accent);}
  .pill.future{background:rgba(210,153,34,.15);color:var(--warn);}
</style>
</head>
<body>
<header>
  <div>
    <h1>四维分析盯盘台</h1>
    <div class="sub">行情 · 技术 · 基本面 · 资金 &nbsp;|&nbsp; 实时免费数据源</div>
  </div>
  <input id="code" value="sh600519" title="股票如 sh600519/600519/hk00700/usAAPL，期货如 IF0/rb0/IF2508">
  <div class="chips" id="quick">
    <span class="chip" data-c="sh600519">茅台</span>
    <span class="chip" data-c="sz000001">平安银行</span>
    <span class="chip" data-c="sh510300">沪深300ETF</span>
    <span class="chip" data-c="IF0">IF主连</span>
    <span class="chip" data-c="rb0">螺纹主连</span>
    <span class="chip" data-c="au0">黄金主连</span>
    <span class="chip" data-c="hk00700">腾讯</span>
  </div>
  <div class="seg" id="periods">
    <button data-p="minute">分时</button>
    <button data-p="day" class="active">日K</button>
    <button data-p="week">周K</button>
    <button data-p="month">月K</button>
    <button data-p="60">60分</button>
    <button data-p="15">15分</button>
  </div>
  <label class="auto"><input type="checkbox" id="auto" checked>自动刷新(3s)</label>
  <div id="status"><span class="dot" id="dot"></span><span id="stxt">就绪</span></div>
</header>

<main>
  <div class="left">
    <div class="card">
      <h2>行情数据 <small id="qname"></small><span id="kindPill"></span></h2>
      <div class="name" id="qtitle">--</div>
      <div class="price-row">
        <div class="price" id="price">--</div>
        <div class="chg" id="chg">--</div>
      </div>
      <div class="kv" id="qkv"></div>
      <div class="depth" id="depth"></div>
    </div>
    <div class="card">
      <h2>基本面 <small>逻辑</small></h2>
      <div class="kv" id="fkv"></div>
      <div class="note" id="fnote"></div>
    </div>
    <div class="card">
      <h2>资金面 <small>博弈</small></h2>
      <div class="kv" id="kkv"></div>
      <div class="note" id="knote"></div>
    </div>
  </div>
  <div class="card">
    <h2>技术面 <small>趋势 · K线 + MA + 量 + MACD + KDJ</small></h2>
    <div id="chart"></div>
  </div>
</main>

<script>
const UP='#ef232a', DOWN='#14b143';
const state={code:'sh600519', period:'day', kind:'stock'};
let chart=null, timer=null;

const $ = id => document.getElementById(id);
function fmtVol(v){
  if(v==null) return '--';
  v=+v;
  if(Math.abs(v)>=1e8) return (v/1e8).toFixed(2)+'亿';
  if(Math.abs(v)>=1e4) return (v/1e4).toFixed(2)+'万';
  return v.toFixed(0);
}
function fmtNum(v,d=2){ return v==null?'--':(+v).toFixed(d); }
function setColor(el,v){ el.style.color = v>0?UP:(v<0?DOWN:'var(--text)'); }
function setStatus(txt,live){ $('stxt').textContent=txt; $('dot').className='dot'+(live?' live':''); }

async function loadAll(){
  setStatus('加载中…',false);
  const url=`/api/analysis?code=${encodeURIComponent(state.code)}&period=${state.period}&limit=160`;
  try{
    const a=await (await fetch(url)).json();
    if(!a.ok){ setStatus('失败: '+a.error,false); return; }
    state.kind=a.kind;
    renderQuote(a.quote);
    renderFundamentals(a.fundamentals);
    renderFunds(a.funds);
    if(state.period==='minute'){
      const m=await (await fetch(`/api/minute?code=${encodeURIComponent(state.code)}`)).json();
      renderMinute(m.ok?m.data:[], a.quote);
    }else{
      renderKline(a.kline.bars, a.kline.indicators);
    }
    setStatus('更新 '+new Date().toLocaleTimeString('zh-CN'),true);
  }catch(e){ setStatus('错误: '+e.message,false); }
}

function renderQuote(q){
  if(!q){ $('qtitle').textContent='无数据'; return; }
  $('qtitle').textContent=`${q.name} (${q.code}) · ${q.currency}` + (q.realtime===false?' · 收盘参考(非实时)':'');
  $('qname').textContent = q.time||'';
  const pill=$('kindPill');
  pill.innerHTML = `<span class="pill ${state.kind}">${state.kind==='future'?'期货':'股票'}</span>`;
  $('price').textContent = q.price==null?'--':fmtNum(q.price);
  const chg = q.change||0, pct=q.changepct||0;
  $('chg').textContent = (chg>0?'+':'')+fmtNum(chg)+'  ('+(pct>0?'+':'')+fmtNum(pct)+'%)';
  setColor($('price'), chg); setColor($('chg'), chg);
  const kv=$('qkv'); kv.innerHTML='';
  const rows=[
    ['今开',q.open],['昨收/结',q.preclose],
    ['最高',q.high],['最低',q.low],
    ['成交量',fmtVol(q.volume)],['成交额',fmtVol(q.amount)],
  ];
  if(state.kind==='stock'){ rows.push(['换手率',q.turnover==null?'--':fmtNum(q.turnover)+'%']); rows.push(['市盈率',q.pe]); }
  else { rows.push(['持仓量',fmtVol(q.openinterest)]); }
  for(const [k,v] of rows){
    const d=document.createElement('div');
    d.innerHTML=`<span>${k}</span><span>${v==null?'--':(typeof v==='number'?fmtNum(v):v)}</span>`;
    kv.appendChild(d);
  }
  // 盘口
  const dep=$('depth'); dep.innerHTML='';
  if(state.kind==='stock' && q.bids && q.asks){
    let h='<div class="hdr">卖盘</div>';
    for(let i=4;i>=0;i--){ const a=q.asks[i]; if(a) h+=`<div class="row ask"><span>卖${i+1} ${fmtNum(a.price)}</span><span>${fmtVol(a.vol)}</span></div>`; }
    h+='<div class="hdr">买盘</div>';
    for(let i=0;i<5;i++){ const b=q.bids[i]; if(b) h+=`<div class="row bid"><span>买${i+1} ${fmtNum(b.price)}</span><span>${fmtVol(b.vol)}</span></div>`; }
    dep.innerHTML=h;
  }else{
    dep.innerHTML='<div class="hdr">提示</div><div class="row"><span>期货实时盘口以持仓/成交量为核心</span></div>';
  }
}

function renderFundamentals(f){
  const kv=$('fkv'); kv.innerHTML='';
  const order=[['市盈率(PE)',f.pe],['换手率',f.turnover==null?null:fmtNum(f.turnover)+'%'],
    ['成交量',fmtVol(f.volume)],['成交额',fmtVol(f.amount)],['今开',f.open],['昨收/结',f.preclose],
    ['最高',f.high],['最低',f.low]];
  if(state.kind==='future' && f.openinterest!=null) order.unshift(['持仓量',fmtVol(f.openinterest)]);
  for(const [k,v] of order){ if(v==null) continue;
    const d=document.createElement('div');
    d.innerHTML=`<span>${k}</span><span>${typeof v==='number'?fmtNum(v):v}</span>`;
    kv.appendChild(d);
  }
  $('fnote').textContent = f.note||'';
}

function renderFunds(f){
  const kv=$('kkv'); kv.innerHTML='';
  const order=[];
  if(state.kind==='stock'){
    order.push(['成交额',fmtVol(f.amount)],['成交量',fmtVol(f.volume)],['换手率',f.turnover==null?null:fmtNum(f.turnover)+'%'],
      ['外盘(主动买)',fmtVol(f.outer)],['内盘(主动卖)',fmtVol(f.inner)],['主力净流入',f.main_net==null?'待扩展':fmtVol(f.main_net)]);
  }else{
    order.push(['持仓量',fmtVol(f.openinterest)],['成交量',fmtVol(f.volume)]);
  }
  for(const [k,v] of order){ if(v==null) continue;
    const d=document.createElement('div');
    d.innerHTML=`<span>${k}</span><span>${typeof v==='number'?fmtNum(v):v}</span>`;
    kv.appendChild(d);
  }
  $('knote').textContent = f.note||'';
}

function renderKline(bars, ind){
  if(!chart) chart=echarts.init($('chart'),'dark');
  const dates=bars.map(b=>b.date);
  const ohlc=bars.map(b=>[b.open,b.close,b.low,b.high]);
  const vol=bars.map(b=>({value:b.volume,itemStyle:{color:b.close>=b.open?UP:DOWN}}));
  const ma=a=>a.map(v=>v==null?null:v);
  const macdBar=ind.macd.hist.map(v=>({value:v,itemStyle:{color:v>=0?UP:DOWN}}));
  const opt={
    animation:false, backgroundColor:'transparent',
    axisPointer:{link:[{xAxisIndex:'all'}],label:{backgroundColor:'#333'}},
    tooltip:{trigger:'axis',axisPointer:{type:'cross'},backgroundColor:'#1c2230',borderColor:'#283040',textStyle:{color:'#c9d1d9'}},
    legend:{data:['MA5','MA10','MA20','MA60','MACD','DIF','DEA','K','D','J'],textStyle:{color:'#8b949e'},top:0},
    grid:[
      {left:56,right:18,top:30,height:'46%'},
      {left:56,right:18,top:'54%',height:'10%'},
      {left:56,right:18,top:'66%',height:'14%'},
      {left:56,right:18,top:'82%',height:'14%'},
    ],
    xAxis:[
      {type:'category',data:dates,gridIndex:0,axisLabel:{show:false},axisLine:{lineStyle:{color:'#283040'}}},
      {type:'category',data:dates,gridIndex:1,axisLabel:{show:false},axisLine:{lineStyle:{color:'#283040'}}},
      {type:'category',data:dates,gridIndex:2,axisLabel:{show:false},axisLine:{lineStyle:{color:'#283040'}}},
      {type:'category',data:dates,gridIndex:3,axisLine:{lineStyle:{color:'#283040'}},axisLabel:{color:'#8b949e'}},
    ],
    yAxis:[
      {scale:true,gridIndex:0,splitLine:{lineStyle:{color:'#1c2230'}},axisLabel:{color:'#8b949e'}},
      {scale:true,gridIndex:1,splitNumber:2,axisLabel:{color:'#8b949e'}},
      {scale:true,gridIndex:2,splitNumber:2,axisLabel:{color:'#8b949e'}},
      {scale:true,gridIndex:3,splitNumber:2,axisLabel:{color:'#8b949e'}},
    ],
    series:[
      {name:'K',type:'candlestick',data:ohlc,xAxisIndex:0,yAxisIndex:0,
        itemStyle:{color:UP,color0:DOWN,borderColor:UP,borderColor0:DOWN}},
      {name:'MA5',type:'line',data:ma(ind.ma5),xAxisIndex:0,yAxisIndex:0,smooth:true,symbol:'none',lineStyle:{width:1}},
      {name:'MA10',type:'line',data:ma(ind.ma10),xAxisIndex:0,yAxisIndex:0,smooth:true,symbol:'none',lineStyle:{width:1}},
      {name:'MA20',type:'line',data:ma(ind.ma20),xAxisIndex:0,yAxisIndex:0,smooth:true,symbol:'none',lineStyle:{width:1}},
      {name:'MA60',type:'line',data:ma(ind.ma60),xAxisIndex:0,yAxisIndex:0,smooth:true,symbol:'none',lineStyle:{width:1}},
      {name:'量',type:'bar',data:vol,xAxisIndex:1,yAxisIndex:1},
      {name:'MACD',type:'bar',data:macdBar,xAxisIndex:2,yAxisIndex:2},
      {name:'DIF',type:'line',data:ind.macd.dif,xAxisIndex:2,yAxisIndex:2,symbol:'none',lineStyle:{width:1,color:'#58a6ff'}},
      {name:'DEA',type:'line',data:ind.macd.dea,xAxisIndex:2,yAxisIndex:2,symbol:'none',lineStyle:{width:1,color:'#d29922'}},
      {name:'K',type:'line',data:ind.kdj.k,xAxisIndex:3,yAxisIndex:3,symbol:'none',lineStyle:{width:1,color:'#58a6ff'}},
      {name:'D',type:'line',data:ind.kdj.d,xAxisIndex:3,yAxisIndex:3,symbol:'none',lineStyle:{width:1,color:'#14b143'}},
      {name:'J',type:'line',data:ind.kdj.j,xAxisIndex:3,yAxisIndex:3,symbol:'none',lineStyle:{width:1,color:'#ef232a'}},
    ]
  };
  chart.setOption(opt,true);
}

function renderMinute(data, q){
  if(!chart) chart=echarts.init($('chart'),'dark');
  const times=data.map(d=>d.time);
  const prices=data.map(d=>d.price);
  const base=q&&q.preclose?q.preclose:null;
  const opt={
    animation:false, backgroundColor:'transparent',
    tooltip:{trigger:'axis',backgroundColor:'#1c2230',borderColor:'#283040',textStyle:{color:'#c9d1d9'}},
    grid:[{left:56,right:18,top:30,height:'82%'}],
    xAxis:[{type:'category',data:times,axisLabel:{color:'#8b949e'},axisLine:{lineStyle:{color:'#283040'}}}],
    yAxis:[{scale:true,axisLabel:{color:'#8b949e'},splitLine:{lineStyle:{color:'#1c2230'}}}],
    series:[{type:'line',data:prices,symbol:'none',lineStyle:{width:1.5,color:UP},
      areaStyle:{color:'rgba(239,35,42,.08)'},
      markLine: base?{silent:true,symbol:'none',lineStyle:{color:'#8b949e',type:'dashed'},data:[{yAxis:base}]}:undefined}]
  };
  chart.setOption(opt,true);
}

// 事件
$('code').addEventListener('keydown',e=>{ if(e.key==='Enter'){ state.code=$('code').value.trim(); loadAll(); }});
$('quick').addEventListener('click',e=>{ const c=e.target.dataset.c; if(c){ $('code').value=c; state.code=c; loadAll(); }});
$('periods').addEventListener('click',e=>{ const p=e.target.dataset.p; if(p){
  [...$('periods').children].forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active'); state.period=p; loadAll(); }});
$('auto').addEventListener('change',e=>{
  if(timer){clearInterval(timer);timer=null;}
  if(e.target.checked) timer=setInterval(refreshQuote,3000);
});
async function refreshQuote(){
  if(document.hidden) return;
  try{
    const r=await (await fetch(`/api/quote?code=${encodeURIComponent(state.code)}`)).json();
    if(r.ok) renderQuote(r.data);
  }catch(e){}
}
window.addEventListener('resize',()=>{ if(chart) chart.resize(); });

// 启动
loadAll();
if($('auto').checked) timer=setInterval(refreshQuote,3000);
</script>
</body>
</html>
