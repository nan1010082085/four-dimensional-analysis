# 四维分析盯盘台 Nginx 配置
# 放置在 /etc/nginx/sites-available/ 或 conf.d/

server {
    listen 80;
    server_name _;  # 替换为你的域名

    # 前端静态文件
    location / {
        root /home/ubuntu/four-dimensional-analysis/frontend-dist;
        try_files $uri $uri/ /index.html;
        
        # 缓存静态资源
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1h;
            add_header Cache-Control "public, immutable";
        }
    }

    # API代理
    location /api/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 静态资源
    location /static/ {
        alias /home/ubuntu/four-dimensional-analysis/static/;
        expires 1h;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:5080/api/config;
    }
}
